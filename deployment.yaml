---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: petclinic
  labels:
    app: petclinic 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petclinic
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - image: 987014986560.dkr.ecr.us-west-1.amazonaws.com/task4
        name:  petclinic-cont
        resources:
          requests:
            cpu: "20m"
            memory: "55M"             
        ports:
        - containerPort:  8761
         
        
      